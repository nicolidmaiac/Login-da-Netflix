<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="css/style.css" />
 </head>
<body class="bg_filmes">
    <header>
      <img src="assets/logo.png" />
    </header>

    <div class="container-fluid p-0">
        <div class="row justify-content-center w-100 m-0">
            <div id="caixa_login" class="col-11 col-sm-7 col-md-5 col-lg-3">
              <h1 class="text-white">Entrar</h1>
              
              <form>
    <div class="mb-3">
      <input type="email" class="form-control" placeholder="Email ou número de telefone" /> 
    </div>
    
    <div class="mb-4">
      <input type="password" class="form-control" placeholder="Senha" />
    </div>
    
    <button class="btn btn-danger w-100">Entrar</button>
    
    <div class="row mt-3" style="font-size: 0.85rem;">
      <div class="col-6 text-muted">
        <input type="checkbox" /> Lembrar de mim
      </div>
      <div class="col-6 text-end">
        <a href="#" class="text-muted text-decoration-none">Precisa de ajuda?</a>
      </div>
    </div>

    <div class="mt-4 textos-finais">
      <p class="text-muted">
        Novo na Netflix? <a href="#" class="text-white text-decoration-none fw-bold">Assine agora.</a>
      </p>
      <p class="text-muted" style="font-size: 0.75rem; line-height: 1.3;">
        Esta página é protegida pelo Google reCAPTCHA para garantir que você não é um robô. <a href="#" class="text-primary text-decoration-none">Saiba mais.</a>
      </p>
    </div>
  </form>
  </div>
        </div>
    </div>
 </body>
</html>
